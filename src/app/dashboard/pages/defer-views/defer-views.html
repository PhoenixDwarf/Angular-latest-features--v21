<app-title title="Defer Views / BLocks" />
<section class="grid grid-cols-1">
  @defer {
    <app-heavy-loaders-slow cssClass="bg-blue-500" />
  } @placeholder {
    <p
      class="h-150 w-full bg-linear-to-r from-gray-200 to-gray-400 animate-pulse rounded flex justify-center items-center"
    >
      Loading ...
    </p>
  }

  @defer (on idle) {
    <app-heavy-loaders-slow cssClass="bg-green-500" />
  } @placeholder {
    <p
      class="h-150 w-full bg-linear-to-r from-gray-200 to-gray-400 animate-pulse rounded flex justify-center items-center"
    >
      Loading ...
    </p>
  }

  @defer (on viewport) {
    <app-heavy-loaders-slow cssClass="bg-purple-500" />
  } @placeholder {
    <p
      class="h-150 w-full bg-linear-to-r from-gray-200 to-gray-400 animate-pulse rounded flex justify-center items-center"
    >
      Loading ...
    </p>
  }
</section>
