<section class="grid grid-cols-1 md:grid-cols-2 gap-3">
  <div class="bg-white rounded shadow p-10">
    <h2 class="text-2xl font-bold mb-5">if: {{ showContent() }}</h2>
    <button
      (click)="toggleContent()"
      class="p-2 bg-blue-500 rounded text-white cursor-pointer"
    >
      CLick me!
    </button>

    <div class="pt-4">
      @if (showContent()) {
        <p>if block</p>
      } @else {
        <p>else block</p>
      }
    </div>
  </div>
</section>
